<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bay of Bengal PFZ Forecast System</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- FontAwesome & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- PapaParse for local file parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151c2c;
      --border-color: #232e42;
      --primary: #38bdf8;
      --strong-pfz: #facc15;
      --mod-pfz: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: var(--card-bg);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 38px; height: 38px; background: rgba(56, 189, 248, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; }
    .brand-title h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .brand-title p { font-size: 0.75rem; color: var(--text-muted); }
    .header-badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--border-color); color: var(--primary); }

    .app-container { display: flex; flex: 1; overflow: hidden; }
    
    .sidebar {
      width: 380px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      padding: 1.1rem;
      overflow-y: auto;
      z-index: 500;
    }

    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-card { background: rgba(11, 15, 25, 0.6); border: 1px solid var(--border-color); padding: 10px; border-radius: 10px; text-align: center; }
    .stat-card .val { font-size: 1.2rem; font-weight: 700; }
    .stat-card .lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; }
    select, input { width: 100%; padding: 0.65rem 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: #0f172a; color: #fff; font-size: 0.85rem; outline: none; }

    .btn { background: var(--primary); color: #000; border: none; padding: 0.7rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .legend-box { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-around; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    .table-wrapper { flex: 1; min-height: 200px; max-height: 260px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; background: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th { position: sticky; top: 0; background: #1e293b; color: var(--primary); padding: 8px; text-align: left; }
    td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:hover { background: rgba(56, 189, 248, 0.1); cursor: pointer; }

    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; background: #0b0f19; }

    .leaflet-popup-content-wrapper { background: var(--card-bg); color: #fff; border: 1px solid var(--border-color); border-radius: 12px; }
    .leaflet-popup-tip { background: var(--card-bg); }
    .popup-card { padding: 4px; }
    .popup-card h4 { font-size: 0.95rem; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    .popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.78rem; }
    .popup-grid div span { color: var(--text-muted); display: block; font-size: 0.7rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-water"></i></div>
      <div class="brand-title">
        <h1>Bay of Bengal PFZ Forecast</h1>
        <p>Oceanographic Modeling & Potential Fishing Zone System</p>
      </div>
    </div>
    <div class="header-badge">
      <i class="fa-regular fa-calendar"></i> <span id="forecast-date">05 Oct 2026</span>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      
      <div class="stat-grid">
        <div class="stat-card">
          <div class="lbl">Total Cells</div>
          <div class="val" id="stat-total" style="color: var(--primary);">0</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Strong PFZ</div>
          <div class="val" id="stat-strong" style="color: var(--strong-pfz);">0</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Moderate</div>
          <div class="val" id="stat-mod" style="color: var(--mod-pfz);">0</div>
        </div>
      </div>

      <div class="control-group">
        <label>PFZ Intensity Filter</label>
        <select id="pfz-filter" onchange="applyFilters()">
          <option value="all">All PFZ Zones (Strong & Moderate)</option>
          <option value="2">Strong PFZ (Yellow)</option>
          <option value="1">Moderate PFZ (Green)</option>
        </select>
      </div>

      <div class="legend-box">
        <div class="legend-item">
          <span class="dot" style="background: var(--strong-pfz);"></span>
          Strong PFZ
        </div>
        <div class="legend-item">
          <span class="dot" style="background: var(--mod-pfz);"></span>
          Moderate PFZ
        </div>
      </div>

      <div class="control-group">
        <label>Map View Mode</label>
        <select id="map-style" onchange="changeMapStyle()">
          <option value="dark">Ocean Dark Mode</option>
          <option value="satellite">Satellite Imagery</option>
          <option value="street">Standard Navigation</option>
        </select>
      </div>

      <div class="control-group">
        <label>Search Latitude / Longitude</label>
        <input type="text" id="search-input" placeholder="e.g. 19.75" onkeyup="applyFilters()">
      </div>

      <div class="control-group" style="flex:1; display:flex; flex-direction:column;">
        <label>
          Coordinate Points 
          <span id="table-count" style="font-weight:normal; font-size:0.75rem;">Showing 0</span>
        </label>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Type</th>
                <th>Lat</th>
                <th>Long</th>
                <th>SST (°C)</th>
              </tr>
            </thead>
            <tbody id="coord-table"></tbody>
          </table>
        </div>
      </div>

      <button class="btn" onclick="downloadCSV()">
        <i class="fa-solid fa-download"></i> Export Filtered CSV
      </button>

    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    const map = L.map('map', { center: [19.80, 90.35], zoom: 7, preferCanvas: true });

    const layers = {
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
      street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 })
    };

    layers.dark.addTo(map);
    let currentLayer = layers.dark;

    let rawData = [];
    let filteredData = [];
    let circleMarkers = [];

    // Relative CSV fetch using PapaParse
    Papa.parse('pfz_all_cells_2026-10-05.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        rawData = results.data.map(row => ({
          date: row.date || row.Date,
          lat: parseFloat(row.latitude || row.Latitude),
          lng: parseFloat(row.longitude || row.Longitude),
          sst: parseFloat(row.sst_C || row.SST_C),
          front: parseFloat(row.front_C_per_km || row.Front_C_per_km),
          speed: parseFloat(row.current_speed_ms || row.Current_Speed_ms),
          pClass: parseInt(row.pfz_class || row.PFZ_Class),
          label: (row.pfz_label || row.PFZ_Label || '').trim()
        })).filter(d => d.pClass === 1 || d.pClass === 2);

        applyFilters();
      }
    });

    function applyFilters() {
      const pClassFilter = document.getElementById('pfz-filter').value;
      const searchQuery = document.getElementById('search-input').value.trim();

      filteredData = rawData.filter(d => {
        const matchesClass = pClassFilter === 'all' || d.pClass == pClassFilter;
        const matchesSearch = !searchQuery || 
                              d.lat.toString().includes(searchQuery) || 
                              d.lng.toString().includes(searchQuery);
        return matchesClass && matchesSearch;
      });

      updateStats();
      renderMarkers();
      renderTable();
    }

    function updateStats() {
      const strongCount = rawData.filter(d => d.pClass === 2).length;
      const modCount = rawData.filter(d => d.pClass === 1).length;
      
      document.getElementById('stat-total').innerText = rawData.length.toLocaleString();
      document.getElementById('stat-strong').innerText = strongCount.toLocaleString();
      document.getElementById('stat-mod').innerText = modCount.toLocaleString();
    }

    function renderMarkers() {
      circleMarkers.forEach(m => map.removeLayer(m));
      circleMarkers = [];

      filteredData.forEach(p => {
        const isStrong = p.pClass === 2;
        const color = isStrong ? '#facc15' : '#22c55e';

        const marker = L.circleMarker([p.lat, p.lng], {
          radius: isStrong ? 5 : 3.5,
          fillColor: color,
          color: color,
          weight: 0.5,
          opacity: 0.9,
          fillOpacity: 0.8
        });

        marker.bindPopup(`
          <div class="popup-card">
            <h4 style="color:${color};">${p.label || (isStrong ? 'Strong PFZ' : 'Moderate PFZ')}</h4>
            <div class="popup-grid">
              <div><span>Latitude</span><b>${p.lat.toFixed(4)}°N</b></div>
              <div><span>Longitude</span><b>${p.lng.toFixed(4)}°E</b></div>
              <div><span>SST</span><b>${p.sst.toFixed(2)} °C</b></div>
              <div><span>Speed</span><b>${p.speed.toFixed(2)} m/s</b></div>
            </div>
          </div>
        `);

        marker.addTo(map);
        circleMarkers.push(marker);
      });
    }

    function renderTable() {
      const tbody = document.getElementById('coord-table');
      tbody.innerHTML = '';
      document.getElementById('table-count').innerText = `Showing ${filteredData.length}`;

      filteredData.slice(0, 100).forEach(p => {
        const isStrong = p.pClass === 2;
        const color = isStrong ? 'var(--strong-pfz)' : 'var(--mod-pfz)';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:${color}; font-weight:600;">${isStrong ? 'Strong' : 'Moderate'}</td>
          <td>${p.lat.toFixed(2)}</td>
          <td>${p.lng.toFixed(2)}</td>
          <td>${p.sst.toFixed(1)}</td>
        `;
        
        tr.onclick = () => map.setView([p.lat, p.lng], 9);
        tbody.appendChild(tr);
      });
    }

    function changeMapStyle() {
      const style = document.getElementById('map-style').value;
