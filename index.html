<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bay of Bengal PFZ Forecast Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.25rem; color: #38bdf8; }
    .container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 340px; background: #1e293b; padding: 1rem; overflow-y: auto; border-right: 1px solid #334155; }
    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.5rem; }
    select, input { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; margin-bottom: 0.75rem; }
    .legend-item { display: flex; align-items: center; font-size: 0.85rem; margin-top: 0.4rem; }
    .legend-color { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    table { width: 100%; font-size: 0.75rem; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #38bdf8; }
    .badge-mod { color: #22c55e; font-weight: bold; }
    .badge-str { color: #eab308; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>🌊 বঙ্গোপসাগর PFZ পূর্বাভাস (5 Oct 2026)</h1>
    <div style="font-size: 0.85rem; color: #94a3b8;">User: mpfzocn</div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="card">
        <label for="pfz-filter">PFZ ধরন নির্বাচন (Filter PFZ)</label>
        <select id="pfz-filter" onchange="filterData()">
          <option value="all">সকল PFZ (All - 1,504 Points)</option>
          <option value="2">Strong PFZ (Yellow - 361 Points)</option>
          <option value="1">Moderate PFZ (Green - 1,143 Points)</option>
        </select>

        <div style="margin-top: 0.5rem;">
          <div class="legend-item"><span class="legend-color" style="background: #eab308;"></span> Strong PFZ (Yellow)</div>
          <div class="legend-item"><span class="legend-color" style="background: #22c55e;"></span> Moderate PFZ (Green)</div>
        </div>
      </div>

      <div class="card">
        <h3>📍 PFZ কোঅর্ডিনেট তালিকা (<span id="count-disp">1504</span>)</h3>
        <div style="max-height: 400px; overflow-y: auto;">
          <table>
            <thead>
              <tr>
                <th>ধরন</th>
                <th>Lat</th>
                <th>Long</th>
                <th>SST (°C)</th>
              </tr>
            </thead>
            <tbody id="coord-table">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script
